name: Build NitroCore Mod

on:
  workflow_dispatch: # Позволяет запускать сборку вручную
  push:
    branches: [ main, master ] # Запуск при пуше в основную ветку

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Unzip project archive
      run: |
        # Распаковываем ваш архив в папку "project"
        unzip -q nitrocore-fabric-1.21.4-project.zip -d project
        echo "Содержимое папки project:"
        ls -la project

    - name: Build with Gradle
      run: |
        # Переходим в распакованную папку и запускаем сборку
        cd project
        # Если внутри архива есть ещё одна вложенная папка, cd нужно указать её.
        # Но если структура стандартная, этой команды достаточно.
        ../gradlew build --no-daemon

    - name: Upload Mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: nitrocore-mod-jar
        # Ищем итоговый .jar файл (исключая sources и dev версии)
        path: project/build/libs/*[!sources].jar
